<text x="641" y="635" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#1D705A">userdata/mistake-book/</text>
<text x="641" y="668" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#1D705A">YYYY-MM-DD.md + 错题索引.md</text>
<text x="641" y="705" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546B63">可从学习日志重建的错题视图</text>
<text x="50" y="764" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546B63">个人笔记写学习日志；不要直接改自动生成的错题页或结构化JSON。</text>
