<text x="76" y="635" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#1D705A">userdata/study-records/</text>
<text x="76" y="668" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#1D705A">YYYY-MM-DD.md</text>
