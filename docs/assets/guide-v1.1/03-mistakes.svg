<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title-3 desc-3">
<title id="title-3">错题自动收录，跨日再验证</title><desc id="desc-3">同题聚合保存经历；当天看答案后重答，不算跨日掌握。；操作示意，不是真实软件截图。</desc>
<defs><marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D705A"/></marker></defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#F4F7F2"/>
<text x="50" y="59" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#193C35">错题自动收录，跨日再验证</text>
<text x="50" y="101" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#546B63">同题聚合保存经历；当天看答案后重答，不算跨日掌握。</text>
