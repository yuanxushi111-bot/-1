<text x="78" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1D705A">待复习</text>
<text x="78" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#546B63">重要错误、核心遗漏</text>
<text x="78" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#546B63">或依赖提示时自动收录</text>
<rect x="440" y="158" width="320" height="160" rx="18" fill="#E5F1E9" stroke="#D8E2DA" stroke-width="1.5"/>
<text x="468" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1D705A">复测中</text>
<text x="468" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#546B63">一次跨日、无提示通过</text>
<text x="468" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#546B63">仍需覆盖原先的错点</text>
<rect x="830" y="158" width="320" height="160" rx="18" fill="#E5F1E9" stroke="#D8E2DA" stroke-width="1.5"/>
<text x="858" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1D705A">已巩固</text>
<text x="858" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#546B63">两个不同日期独立通过</text>
<text x="858" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#546B63">原错点覆盖，历史继续保留</text>
<line x1="382" y1="238" x2="428" y2="238" stroke="#1D705A" stroke-width="2.5" marker-end="url(#arrow-3)"/>
<line x1="772" y1="238" x2="818" y2="238" stroke="#1D705A" stroke-width="2.5" marker-end="url(#arrow-3)"/>
<path d="M 990 331 V 377 H 210 V 331" fill="none" stroke="#1D705A" stroke-width="2.5" marker-end="url(#arrow-3)"/>
<text x="600" y="417" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#1D705A">再次答错或依赖提示 → 回到待复习</text>
<rect x="50" y="451" width="1100" height="69" rx="12" fill="#F8F0DF"/>
