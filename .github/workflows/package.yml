name: Build public source package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/check_project.py
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: tax-exam-skill-public-source
          path: dist/*public-source*
